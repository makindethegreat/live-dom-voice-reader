<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live DOM Voice Reader</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #151515;
      color: #f4f1eb;
    }
    * { box-sizing: border-box; }
    body {
      width: 260px;
      margin: 0;
      padding: 17px;
      background: #151515;
    }
    h1 {
      margin: 0 0 5px;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0 0 16px;
      color: #a8a39b;
      font-size: 11px;
      line-height: 1.45;
    }
    label {
      display: block;
      margin-bottom: 7px;
      color: #c8c2b8;
      font-size: 11px;
      font-weight: 600;
    }
    select {
      display: block;
      width: 100%;
      min-height: 36px;
      padding: 0 9px;
      border: 1px solid #45413b;
      border-radius: 6px;
      outline: none;
      background: #22211f;
      color: #f4f1eb;
      font: inherit;
      font-size: 12px;
    }
    select:focus { border-color: #d69a57; }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
      margin-top: 13px;
    }
    button {
      min-height: 35px;
      border: 1px solid #45413b;
      border-radius: 6px;
      background: #242321;
      color: #f4f1eb;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #302d29; }
    button:focus-visible { outline: 2px solid #d69a57; outline-offset: 2px; }
    #play {
      border-color: #d69a57;
      background: #d69a57;
      color: #171513;
    }
    #play:hover { background: #e3ad70; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #status {
      min-height: 28px;
      margin: 12px 0 0;
      color: #aaa49a;
      font-size: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <h1>Live DOM Voice Reader</h1>
    <p class="subtitle">Listen to the main content on this page.</p>

    <label for="voice-select">Reading voice</label>
    <select id="voice-select" aria-label="Reading voice">
      <option value="">Loading available voices…</option>
    </select>

    <div class="controls">
      <button id="play" type="button">Play</button>
      <button id="pause" type="button">Pause</button>
      <button id="stop" type="button">Stop</button>
    </div>

    <p id="status" role="status" aria-live="polite">Preparing reader…</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
